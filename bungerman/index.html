<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#242424"><meta name="description" content="BUNGERMAN. An animated peanut arcade showdown."><title>BUNGERMAN</title><link rel="stylesheet" href="style.css?v=mp12"></head>
<body><button id="fullscreen" class="fullscreen-button" aria-label="Enter fullscreen game" aria-pressed="false" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><main class="cabinet"><img class="cabinet-art" src="assets/runtime/cabinet-v7.webp" alt="BUNGERMAN arcade cabinet" draggable="false">
<header><canvas id="logo" width="320" height="84" role="img" aria-label="BUNGERMAN"></canvas></header>
<section class="machine" aria-label="Game">
<div class="hud"><div class="player-hud"><canvas id="hud-face" width="32" height="36" aria-hidden="true"></canvas><span id="hearts" aria-label="1 health">♥</span></div><strong id="score" aria-label="Score">00000</strong><div class="time"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 0h8v2H4zM2 4h2V2h8v2h2v10h-2v2H4v-2H2zm5 1v5h5V8H9V5z"/></svg><strong id="timer">75</strong></div><button id="sound" class="icon-button" aria-label="Enable sound" aria-pressed="false" title="Sound"><span id="sound-icon" aria-hidden="true">♪</span><span id="sound-off" aria-hidden="true">×</span></button><button id="pause" class="icon-button" aria-label="Pause" disabled>Ⅱ</button></div>
<div class="screen"><canvas id="game" width="416" height="352" tabindex="0" aria-label="Game arena. Move with WASD or arrow keys. Press Space to plant two bombs at a time. E fires an RPG. Escape pauses. Touch: drag to move; tap to plant a bomb."></canvas>
<div id="menu" class="menu" data-view="select"><div id="select-view" class="menu-view">
<div id="pack-status" role="status"></div><button id="retry-assets" class="secondary-button" hidden>RETRY</button>
<div class="roster" role="group" aria-label="Choose character">
<button class="character selected" data-character="peanut" aria-pressed="true" aria-label="Burnt Peanut" title="Cosmetic character"><canvas class="portrait" data-portrait="peanut" width="88" height="100" aria-hidden="true"></canvas><span>PEANUT</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="hutch" aria-pressed="false" aria-label="Hutch" title="Cosmetic character"><canvas class="portrait" data-portrait="hutch" width="88" height="100" aria-hidden="true"></canvas><span>HUTCH</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="ninja" aria-pressed="false" aria-label="Ninja" title="Cosmetic character"><canvas class="portrait" data-portrait="ninja" width="88" height="100" aria-hidden="true"></canvas><span>NINJA</span><i aria-hidden="true">▼</i></button>
<button class="character" data-character="tpain" aria-pressed="false" aria-label="T-Pain" title="Cosmetic character"><canvas class="portrait" data-portrait="tpain" width="88" height="100" aria-hidden="true"></canvas><span>T-PAIN</span><i aria-hidden="true">▼</i></button>
</div><div class="menu-footer"><div class="map-picker" role="group" aria-label="Choose map"><button id="map-prev" aria-label="Previous map">&#8249;</button><div class="map-card"><canvas id="map-preview" data-map-preview="garden" aria-hidden="true"></canvas><span id="map-name">GARDEN</span></div><button id="map-next" aria-label="Next map">&#8250;</button></div><div class="menu-actions"><button id="multiplayer" class="pixel-button multiplayer-button">MULTIPLAYER</button><button id="play" class="pixel-button">PLAY <span aria-hidden="true">&#9654;</span></button></div></div><div class="best" title="Personal best" aria-label="Personal best"><span aria-hidden="true">★</span><span id="best">00000</span></div>
</div><div id="multiplayer-view" class="menu-view" hidden><h1>MULTIPLAYER</h1><p class="room-caption">UP TO 4 PLAYERS</p><button id="room-create" class="pixel-button">CREATE ROOM</button><form id="room-join-form"><label for="room-code">ROOM CODE</label><div class="join-row"><input id="room-code" name="room-code" maxlength="6" minlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false" required><button id="room-join" class="pixel-button" type="submit">JOIN</button></div></form><p id="multiplayer-status" class="connection-status" role="status" aria-live="polite"></p><button id="multiplayer-back" class="secondary-button">BACK</button></div><div id="lobby-view" class="menu-view" hidden><div class="lobby-heading"><div><span class="room-caption">ROOM</span> <strong id="lobby-code">------</strong></div><span id="lobby-map">GARDEN</span></div><div class="lobby-roster"><div class="lobby-slot" data-slot="0"><span class="lobby-player">PLAYER 1</span><canvas class="lobby-portrait" width="88" height="100" aria-hidden="true"></canvas><span class="lobby-character">OPEN</span><span class="lobby-ready">WAITING</span></div><div class="lobby-slot" data-slot="1"><span class="lobby-player">PLAYER 2</span><canvas class="lobby-portrait" width="88" height="100" aria-hidden="true"></canvas><span class="lobby-character">OPEN</span><span class="lobby-ready">WAITING</span></div><div class="lobby-slot" data-slot="2"><span class="lobby-player">PLAYER 3</span><canvas class="lobby-portrait" width="88" height="100" aria-hidden="true"></canvas><span class="lobby-character">OPEN</span><span class="lobby-ready">WAITING</span></div><div class="lobby-slot" data-slot="3"><span class="lobby-player">PLAYER 4</span><canvas class="lobby-portrait" width="88" height="100" aria-hidden="true"></canvas><span class="lobby-character">OPEN</span><span class="lobby-ready">WAITING</span></div></div><div class="lobby-character-picker" role="group" aria-label="Your character"><button id="lobby-character-prev" aria-label="Previous character">&#8249;</button><strong id="lobby-character-name">PEANUT</strong><button id="lobby-character-next" aria-label="Next character">&#8250;</button></div><button id="lobby-ready" class="pixel-button" aria-pressed="false">READY</button><p id="lobby-status" class="connection-status" role="status" aria-live="polite">Waiting for players...</p><button id="lobby-leave" class="secondary-button">LEAVE</button><div id="lobby-countdown" role="status" aria-live="assertive" hidden></div></div><div id="state-view" class="menu-view" hidden><canvas id="menu-art" width="160" height="124" aria-hidden="true"></canvas><h1 id="state-title">PAUSED</h1><p id="state-score" hidden></p><button id="continue" class="pixel-button">RESUME <span aria-hidden="true">▶</span></button><button id="change-character" class="secondary-button" aria-label="Return to character selection">CHARACTERS</button></div></div><button id="rpg-fire" hidden title="Fire RPG · E" aria-label="Fire RPG"><img src="assets/runtime/rpg.webp" alt=""><span id="rpg-ammo">3</span><kbd>E</kbd></button><div id="hit-feedback" aria-hidden="true"></div><div id="toast" class="toast" role="status"></div>
</div>
</section>
<div class="deck-controls"><div id="joystick" role="group" aria-label="Drag joystick to move"></div><button id="touch-bomb" aria-label="Plant bomb" title="Plant bomb · Space"></button><button id="touch-rpg" aria-label="Fire RPG" title="Fire RPG &middot; E"></button></div></main><script type="module" src="game.js?v=mp12"></script></body></html>
