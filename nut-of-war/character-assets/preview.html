<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age of Nut · full-body animations</title>
<style>body{margin:0;background:#191b21;color:#f2e5ba;font:16px system-ui;text-align:center}main{max-width:1100px;margin:auto;padding:20px}canvas{display:block;width:100%;height:auto;background:#84b9d0;border-radius:8px}nav,.controls{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:9px;margin:18px 0}button,select{padding:10px 16px;border:0;border-radius:6px;background:#f3ce66;font:inherit;cursor:pointer}button[aria-pressed=true]{outline:2px solid white}a{color:#f3ce66}h1{font-size:24px}input{width:260px}#status{min-height:24px}.back{display:block;text-align:left}small{color:#b8b5ab}</style>
<main><a class="back" href="../">← Back to game</a><h1>AGE OF NUT · full-body animations</h1><canvas width="1050" height="380" aria-label="Original, Peanut and Hutch animation comparison"></canvas>
<nav><button data-state="idle">Idle</button><button data-state="walk" aria-pressed="true">Walk</button><button data-state="attack">Attack</button><button data-state="die">Die</button></nav>
<div class="controls"><button id="pause">Pause</button><button id="prev" aria-label="Previous frame">◀</button><input id="scrub" type="range" min="0" max="42" value="0" aria-label="Animation frame"><button id="next" aria-label="Next frame">▶</button><select id="speed" aria-label="Playback speed"><option value="0.25">¼ speed</option><option value="0.5">½ speed</option><option value="1" selected>Normal speed</option></select><button id="flip">Face left</button></div>
<p id="status">Loading full-body frames…</p><p><a href="Age-of-Nut-Fullbody-Animations.zip" download>Download animation pack</a> · <a href="fullbody/README.txt">Integration notes</a></p><small>Reference-guided redraws · Original frame counts and 30 fps timing · No separate limb rigs</small></main>
<script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),scrub=document.querySelector('#scrub'),status=document.querySelector('#status');
let data,images={},state='walk',frame=0,elapsed=0,last=0,paused=false,flip=false,speed=1;
const people=['original','peanut','hutch'],names=['Original reference','Burnt Peanut','HutchMF'];
function pause(value){paused=value;document.querySelector('#pause').textContent=paused?'Play':'Pause'}
document.querySelector('#pause').onclick=()=>{if(state==='die'&&frame===data.animations[state].count-1){frame=0;elapsed=0}pause(!paused)};
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;frame=0;elapsed=0;scrub.max=data.animations[state].count-1;document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',x===b));pause(false)});
function step(n){pause(true);frame=(frame+n+data.animations[state].count)%data.animations[state].count;elapsed=0}
document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);
scrub.oninput=()=>{pause(true);frame=+scrub.value;elapsed=0};document.querySelector('#speed').onchange=e=>speed=+e.target.value;
document.querySelector('#flip').onclick=e=>{flip=!flip;e.target.textContent=flip?'Face right':'Face left'};
function draw(now){if(last&&!paused){elapsed+=Math.min((now-last)/1000,.1)*speed;let m=data.animations[state];while(elapsed>=m.durations[frame]/m.fps){elapsed-=m.durations[frame]/m.fps;if(frame+1<m.count)frame++;else if(m.loop)frame=0;else{pause(true);break}}}last=now;
ctx.clearRect(0,0,1050,380);ctx.fillStyle='#628f48';ctx.fillRect(0,315,1050,65);
people.forEach((p,i)=>{ctx.fillStyle='#19232b';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.fillText(names[i],175+i*350,33);let entry=data.characters[p][state].frames[frame];if(entry){let s=entry.src,d=entry.dst;ctx.save();ctx.translate(175+i*350,45);if(flip)ctx.scale(-1,1);ctx.drawImage(images[p+'/'+state],...s,d[0]-160,d[1],d[2],d[3]);ctx.restore()}});
scrub.value=frame;status.textContent=`${state[0].toUpperCase()+state.slice(1)} · Frame ${frame+1} / ${data.animations[state].count} · 30 fps${state==='attack'&&frame===12?' · SOUND CUE':''}${state==='attack'&&frame===19?' · HIT FRAME':''}`;requestAnimationFrame(draw)}
try{data=await(await fetch('fullbody/animations.json')).json();await Promise.all(people.flatMap(p=>Object.entries(data.characters[p]).map(async([s,a])=>{let im=new Image;im.src='fullbody/'+a.image;await im.decode();images[p+'/'+s]=im})));requestAnimationFrame(draw)}catch(e){status.textContent='Could not load animation assets. Please reload.';console.error(e)}
</script></html>
