<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age of Nut — animation assets</title><style>body{margin:0;background:#191b21;color:#f2e5ba;font:16px system-ui;text-align:center}canvas{display:block;width:min(100%,960px);height:auto;margin:auto;background:#84b9d0}nav{padding:20px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}button{padding:10px 18px;background:#f3ce66;border:0;border-radius:6px;font:inherit;cursor:pointer}button[aria-pressed=true]{outline:3px solid white}h1{font-size:24px}a{color:#f3ce66}</style><h1>AGE OF NUT · animation assets</h1><canvas width="960" height="440" aria-label="Animated Burnt Peanut and HutchMF sprites"></canvas><nav><button data-row="0">Idle</button><button data-row="1" aria-pressed="true">Walk</button><button data-row="2">Attack</button><button data-row="3">Die</button><button id="pause">Pause</button><button id="flip">Face left</button></nav><p>Burnt Peanut · HutchMF</p><p><a href="baked/peanut.png" download>Peanut frames</a> · <a href="baked/hutch.png" download>Hutch frames</a> · <a href="README.txt">Rig and integration notes</a></p><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),images=['peanut','hutch'].map(name=>{let im=new Image;im.src='baked/'+name+'.png';return im});let row=1,elapsed=0,last=0,paused=false,flip=false;const durations=[1.2,.8,.9,.8];
document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{row=+b.dataset.row;elapsed=0;document.querySelectorAll('[data-row]').forEach(x=>x.setAttribute('aria-pressed',x===b))});document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};document.querySelector('#flip').onclick=e=>{flip=!flip;e.target.textContent=flip?'Face right':'Face left'};
function draw(now){if(last&&!paused)elapsed+=(now-last)/1000;last=now;let frame=row===3?Math.min(11,Math.floor(elapsed/durations[row]*12)):Math.floor(elapsed/durations[row]*12)%12;ctx.clearRect(0,0,960,440);ctx.fillStyle='#628f48';ctx.fillRect(0,374,960,66);for(let i=0;i<2;i++){if(!images[i].complete)continue;ctx.save();ctx.translate(i?690:270,375);ctx.scale(flip?-1.8:1.8,1.8);ctx.drawImage(images[i],frame*384,row*256,384,256,-190,-220,384,256);ctx.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
