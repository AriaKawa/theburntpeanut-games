<style>
:root{color-scheme:dark;--ink:#f4efe6;--accent:#ffcf5a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Figtree,system-ui,sans-serif;background-color:#100f15;background-image:radial-gradient(ellipse at 12% 25%,#8a643122,transparent 50%),radial-gradient(ellipse at 90% 60%,#69489229,transparent 55%),radial-gradient(#ffffff09 .7px,transparent .7px);background-size:auto,auto,8px 8px;background-attachment:fixed}
a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.wrap{width:min(1240px,calc(100% - 40px));margin:auto}
header{border-bottom:1px solid #ffffff0e;background:#100f1570;backdrop-filter:blur(14px)}
.brand{display:inline-flex;align-items:center;gap:12px;min-height:84px;font:800 23px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.5px}
.brand b{display:grid;place-items:center;background:var(--accent);color:#20190a;border-radius:11px;width:36px;height:36px;font-size:18px}
main{padding:64px 0 88px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.card{display:block;min-width:0;border:1px solid #ffffff1b;border-radius:22px;background:linear-gradient(145deg,#26222d,#17161d);overflow:hidden;box-shadow:0 20px 50px #0004;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px);border-color:#ffcf5a70;box-shadow:0 24px 60px #0007}
.art{position:relative;aspect-ratio:1/1;overflow:hidden;background:radial-gradient(ellipse at center,#383127,#101014 75%);display:grid;place-items:center;border-bottom:1px solid #ffffff12}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover img{transform:scale(1.025)}
.cabinet img{object-fit:contain;padding:14px 0;background:radial-gradient(ellipse at 50% 55%,#5d39213b,#111015 75%)}
.book img{object-fit:contain;background:#201c19}
.meta{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px}
h1{font:700 22px/1.2 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.4px;margin:0}
.arrow{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#ffcf5a14;color:var(--accent);font-size:22px}
.skip{position:absolute;left:20px;top:-100px;padding:12px;background:var(--accent);color:#15110a;z-index:10}.skip:focus{top:10px}
@media(max-width:850px){.grid{gap:16px}.meta{padding:18px 16px}h1{font-size:19px}.arrow{width:28px;height:28px}}
@media(max-width:650px){.wrap{width:calc(100% - 32px)}.brand{min-height:72px;font-size:21px}main{padding:28px 0 44px}.grid{grid-template-columns:1fr;gap:24px}.art{aspect-ratio:6/5}.cabinet{aspect-ratio:1/1}.meta{padding:18px 22px}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.sound-toggle{display:grid;place-items:center;width:42px;height:42px;border:1px solid #ffffff25;border-radius:13px;background:#211e27;color:#ffcf5a;cursor:pointer;font-size:22px}.sound-toggle:hover{background:#302a35}.sound-toggle[aria-pressed="false"]{color:#a7a2b3}
/* Decorative desktop portraits drift below the interactive content. */
body{isolation:isolate}
.peanut-floaters{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.peanut-floater{position:absolute;width:clamp(130px,19vw,275px);height:auto;opacity:.23;filter:drop-shadow(0 10px 22px #0005);animation:peanut-drift 26s ease-in-out infinite alternate;will-change:transform;user-select:none}
.peanut-floater:nth-child(1){left:-3%;top:8%;--x:45px;--y:40px;--r:8deg;animation-delay:-7s}
.peanut-floater:nth-child(2){right:-2%;top:12%;--x:-40px;--y:55px;--r:-9deg;animation-duration:31s;animation-delay:-18s}
.peanut-floater:nth-child(3){left:15%;bottom:-6%;--x:55px;--y:-45px;--r:-7deg;animation-duration:29s;animation-delay:-11s}
.peanut-floater:nth-child(4){right:18%;bottom:-8%;--x:-50px;--y:-35px;--r:7deg;animation-duration:34s;animation-delay:-23s}
@keyframes peanut-drift{from{transform:translate3d(0,0,0) rotate(-4deg)}to{transform:translate3d(var(--x),var(--y),0) rotate(var(--r))}}
@media(max-width:650px){.peanut-floater{width:clamp(125px,34vw,180px);opacity:.18}.peanut-floater:nth-child(3){left:-8%;bottom:12%}.peanut-floater:nth-child(4){right:-6%;bottom:-3%}}
@media(prefers-reduced-motion:reduce){.peanut-floater{animation:none;will-change:auto}}
