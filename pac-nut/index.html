<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b08"><title>PAC NUT</title><link rel="icon" href="assets/peanut.png"><link rel="stylesheet" href="style.css"></head><body><main><h1><img src="assets/title.png" alt="PAC NUT"></h1><section class="cabinet" aria-label="Pac Nut game"><div class="hud"><output id="score" aria-label="Score">000000</output><div id="lives" aria-label="Lives"></div><output id="best" aria-label="Personal best">000000</output></div><div class="screen"><canvas id="game" width="630" height="690" tabindex="0" aria-label="Arrow keys, WASD, or swipe to move. AK-47 automatically fires down the corridor while armed. P pauses."></canvas><div id="overlay"><img class="hero" src="assets/peanut.png" alt=""><button id="start" class="icon play" aria-label="Let's Ride"></button></div></div><div class="controls"><button id="sound" class="icon mute" aria-label="Toggle sound" aria-pressed="false"></button><div id="progress" role="progressbar" aria-label="Maze completion"></div><button id="fire" class="fire-button" aria-label="AK-47 pickup required" disabled><img src="assets/ak.png" alt=""></button><button id="pause" class="icon pause" aria-label="Pause" disabled></button><button id="restart" class="icon restart" aria-label="Restart"></button></div></section><div class="touch" aria-label="Movement"><button class="icon up" data-dir="up" aria-label="Up"></button><div><button class="icon left" data-dir="left" aria-label="Left"></button><button class="icon down" data-dir="down" aria-label="Down"></button><button class="icon right" data-dir="right" aria-label="Right"></button></div></div></main><script src="engine.js"></script></body></html>
